name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test citation parsing and error handling
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py' -v
      - name: Fetch current citation data
        run: timeout 180s python -u google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Check out the existing statistics branch
        uses: actions/checkout@v5
        with:
          ref: google-scholar-stats
          path: citation-stats
      - name: Publish validated citation data
        run: |
          cp google_scholar_crawler/results/gs_data.json citation-stats/gs_data.json
          cp google_scholar_crawler/results/gs_data_shieldsio.json citation-stats/gs_data_shieldsio.json
          cd citation-stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.'
            exit 0
          fi
          git commit -m 'Update Google Scholar citation data'
          git push origin HEAD:google-scholar-stats
